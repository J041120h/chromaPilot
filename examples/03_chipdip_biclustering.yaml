# Example 3 — ChIP-DIP: barcode processing through biclustering.
#
#   python chromapilot/agent.py -r examples/03_chipdip_biclustering.yaml
#
# ChIP-DIP data enters the pipeline through the chipdip_prep tool, which wraps
# the ChIP-DIP Snakemake workflow. The first run of that tool builds its own
# conda environment under tools/chipdip_prep/env (several GB, one time).

prompt_template: >
  We have raw paired-end FASTQ files generated from ChIP-DIP experiments with a
  UMI length of 8, located at:

  /path/to/chipdip_data/fastq

  The barcode configuration file is located at:

  /path/to/chipdip_data/config.txt

  The barcode format file is located at:

  /path/to/chipdip_data/format.txt

  The DPM and BPM barcode FASTA files are located at:

  /path/to/chipdip_data/dpm96.fasta
  /path/to/chipdip_data/bpm.fasta

  The dataset contains three samples: 0hr, 6hr, and 24hr.

  Perform biclustering analysis on each sample separately to identify groups of
  regions and CRF pairs that share similar localization patterns across the
  genome. The reference genome to use is mm10.

  All intermediate files and final results should be written to the following
  output directory:

root_output_dir: /path/to/results/chipdip_biclustering
auto_feedback: "good"
n_runs: 1
max_wall_time_s: 15000
max_steps: 2000
max_interrupts: 20
